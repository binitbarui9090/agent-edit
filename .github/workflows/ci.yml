name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The lowest version package.json allows, and the current LTS.
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Ubuntu's FFmpeg includes libass and drawtext, which captions and tests need. GitHub's runners
      # often have it already, and a package mirror that hangs should fail fast rather than for hours.
      - name: Install FFmpeg
        timeout-minutes: 5
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - run: ffmpeg -hide_banner -filters | grep -E "drawtext|subtitles"
      - run: npm ci
      - run: cp .env.example .env
      - run: docker compose up -d --wait
      - run: npm run typecheck
      - run: npx prettier --check .
      - run: npm test
