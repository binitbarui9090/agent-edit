name: agent-edit

services:
  mongo:
    image: mongo:8
    ports: ['127.0.0.1:27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8
    # BullMQ requires noeviction: an evicted job key silently loses work.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    # 6380 on the host: another local project already publishes 6379.
    ports: ['127.0.0.1:6380:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo-data:
  redis-data:
